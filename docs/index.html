<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Window Focus Highlighter</title>
<meta name="description" content="A tiny Windows tray app that briefly highlights whichever window just received focus, then fades out.">
<style>
:root{--bg:#fff;--fg:#1a1f2b;--mute:#5d6678;--card:#f2f4f8;--line:#e3e7ee;--accent:#2f7df6;--glow:51,153,255;--desk:#dfe6f3;--win:#fff;--bar:#eef1f6;--ph:#d3d9e4}
@media(prefers-color-scheme:dark){:root{--bg:#12151b;--fg:#e8ebf2;--mute:#98a1b3;--card:#1b2029;--line:#262c37;--accent:#5b9bff;--desk:#0b0e14;--win:#242a35;--bar:#2d3440;--ph:#3b4351}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 system-ui,"Segoe UI",sans-serif}
main{max-width:900px;margin:0 auto;padding:0 20px}
a{color:var(--accent)}
.top{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding-bottom:24px}
.hero{text-align:center;padding:64px 0 24px}
h1{font-size:clamp(2.1rem,6vw,3.2rem);line-height:1.1;margin:0 0 14px;letter-spacing:-.02em}
.lead{color:var(--mute);font-size:1.2rem;margin:0 auto 26px;max-width:520px}
.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:11px 22px;border-radius:9px;font-weight:600;margin:0 4px 8px}
.btn.alt{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.facts{color:var(--mute);font-size:.95rem;margin-top:6px}

/* animated desktop */
.w{position:absolute;width:44%;height:56%;background:var(--win);border-radius:9px;box-shadow:0 6px 22px #0003}
.w::before{content:"";position:absolute;inset:0 0 auto;height:26px;background:var(--bar);border-radius:9px 9px 0 0}
.w i{position:absolute;left:16px;height:7px;border-radius:4px;background:var(--ph)}
.w i:nth-child(1){top:46px;width:62%}.w i:nth-child(2){top:64px;width:78%}.w i:nth-child(3){top:82px;width:48%}.w i:nth-child(4){top:100px;width:70%}
.w::after{content:"";position:absolute;inset:-6px;border-radius:14px;border:5px solid rgba(var(--glow),.85);box-shadow:0 0 14px 2px rgba(var(--glow),.55);opacity:0;pointer-events:none;animation:flash 9s infinite}
@keyframes flash{0%{opacity:0}2%{opacity:1}12%{opacity:1}24%,100%{opacity:0}}
.caption{text-align:center;color:var(--mute);font-size:.9rem}

/* dual monitors */
.duo{display:flex;gap:18px;justify-content:center}
.mw{flex:1;max-width:420px;position:relative;padding-bottom:30px}
.mw::before{content:"";position:absolute;bottom:10px;left:50%;width:14%;height:20px;transform:translateX(-50%);background:linear-gradient(#3a4254,#262c3a)}
.mw::after{content:"";position:absolute;bottom:0;left:50%;width:36%;height:10px;transform:translateX(-50%);background:linear-gradient(#4a5268,#2b3140);border-radius:6px 6px 3px 3px}
.mon{position:relative;aspect-ratio:16/10;background:var(--desk);border:5px solid #2b3140;border-radius:10px;overflow:hidden}
.mon .w{left:calc(var(--x)*1%);top:calc(var(--y)*1%);width:calc(var(--w)*1%);height:calc(var(--h)*1%);border-radius:5px;box-shadow:0 2px 8px #0004}
.mon .w::before{height:14px;border-radius:5px 5px 0 0}
.mon .w:nth-child(2n)::before{filter:brightness(.9)}
.mon .w i{height:5px;left:10px}
.mon .w i:nth-child(1){top:24px;width:60%}.mon .w i:nth-child(2){top:36px;width:42%}
.mon .w::after{inset:-4px;border-radius:8px;border-width:3px;box-shadow:0 0 10px 1px rgba(var(--glow),.55);z-index:50;animation:flash 12s infinite}
.mon .w:not(.f0):not(.f1):not(.f2):not(.f3)::after{display:none}
.mon .w.f0,.mon .w.f1,.mon .w.f2,.mon .w.f3{animation:raise 12s infinite}
.mon .w.f1{animation-delay:3s}.mon .w.f2{animation-delay:6s}.mon .w.f3{animation-delay:9s}
@keyframes raise{0%,49.9%{z-index:10}50%,100%{z-index:auto}}
.mon .w.f1::after{animation-delay:3s}.mon .w.f2::after{animation-delay:6s}.mon .w.f3::after{animation-delay:9s}
@media(max-width:640px){.mon .w::before{height:8px}.mon .w i{display:none}}
h2{font-size:1.6rem;margin:72px 0 20px;text-align:center;letter-spacing:-.01em}

/* styles */
.styles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.st b{display:block;margin-top:12px}
.mini{position:relative;height:96px;border-radius:8px;background:var(--desk)}
.mini span{position:absolute;inset:18px 26px;border-radius:6px;background:var(--win)}
.mini span::before{content:"";position:absolute;inset:0 0 auto;height:12px;background:var(--bar);border-radius:6px 6px 0 0}
.mini span::after{content:"";position:absolute;inset:-4px;border-radius:9px;opacity:0;animation:flash2 3.6s infinite}
.s-b span::after{border:3px solid rgba(var(--glow),.9);box-shadow:0 0 8px rgba(var(--glow),.5)}
.s-t span::after{inset:0;border-radius:6px;background:rgba(var(--glow),.35)}
.s-bt span::after{border:3px solid rgba(var(--glow),.9);box-shadow:0 0 8px rgba(var(--glow),.5);background:rgba(var(--glow),.25)}
@keyframes flash2{0%{opacity:0}8%,40%{opacity:1}75%,100%{opacity:0}}


/* tabs */
.tabs{text-align:center}
.tabs input{position:absolute;opacity:0;pointer-events:none}
.tabs label{display:inline-block;padding:7px 16px;margin:0 3px 14px;border-radius:99px;cursor:pointer;color:var(--mute);border:1px solid var(--line);font-size:.95rem}
.tabs img{display:none;width:100%;max-width:680px;height:auto;border-radius:10px;box-shadow:0 10px 40px #0004;margin:0 auto}
#t1:checked~.p1,#t2:checked~.p2,#t3:checked~.p3{display:block}
#t1:checked~label[for=t1],#t2:checked~label[for=t2],#t3:checked~label[for=t3]{background:var(--accent);border-color:var(--accent);color:#fff}
#t1:focus-visible~label[for=t1],#t2:focus-visible~label[for=t2],#t3:focus-visible~label[for=t3]{outline:2px solid var(--fg);outline-offset:2px}

footer{margin:64px 0 40px;text-align:center;color:var(--mute);font-size:.9rem}
@media(prefers-reduced-motion:reduce){.w::after,.mini span::after{animation:none;opacity:.9}}
</style>
</head>
<body>
<main>
<div class="top">
<section class="hero">
<h1>Window Focus Highlighter</h1>
<p class="lead">A tiny Windows tray app that highlights whichever window just got focus</p>
<a class="btn" href="https://github.com/priomsrb/window-focus-highlighter/releases/latest">Download</a>
<a class="btn alt" href="https://github.com/priomsrb/window-focus-highlighter">GitHub</a>
<div class="facts">~50 KB &middot; no installer</div>

</section>

<div class="duo" aria-hidden="true">
<div class="mw"><div class="mon"><div class="w" style="--x:4;--y:6;--w:50;--h:52"><i></i><i></i></div><div class="w" style="--x:52;--y:8;--w:44;--h:40"><i></i><i></i></div><div class="w" style="--x:58;--y:52;--w:38;--h:40"><i></i><i></i></div><div class="w f0" style="--x:30;--y:28;--w:48;--h:54"><i></i><i></i></div><div class="w f2" style="--x:4;--y:56;--w:42;--h:38"><i></i><i></i></div></div></div>
<div class="mw"><div class="mon"><div class="w" style="--x:6;--y:10;--w:44;--h:40"><i></i><i></i></div><div class="w" style="--x:54;--y:56;--w:40;--h:38"><i></i><i></i></div><div class="w" style="--x:50;--y:6;--w:42;--h:36"><i></i><i></i></div><div class="w f1" style="--x:36;--y:20;--w:56;--h:46"><i></i><i></i></div><div class="w f3" style="--x:6;--y:56;--w:48;--h:38"><i></i><i></i></div></div></div>
</div>
<p class="caption" style="margin-top:18px">Alt+Tab or click a window, and it gets highlighted.</p>
</div>

<h2>Your look</h2>
<div class="styles">
<div class="st"><div class="mini s-b"><span></span></div><b>Border</b></div>
<div class="st"><div class="mini s-t"><span></span></div><b>Tint</b></div>
<div class="st"><div class="mini s-bt"><span></span></div><b>Border + tint</b></div>
</div>

<h2>Settings</h2>
<div class="tabs">
<input type="radio" name="t" id="t1" checked><input type="radio" name="t" id="t2"><input type="radio" name="t" id="t3">
<label for="t1">Appearance</label><label for="t2">Timing</label><label for="t3">Behavior</label>
<img class="p1" src="img/appearance.png" width="1021" height="739" alt="Appearance settings: style, color, opacity, thickness and edge fade, with a live preview" loading="lazy">
<img class="p2" src="img/timing.png" width="1021" height="739" alt="Timing settings: how long the highlight shows and how long it takes to fade" loading="lazy">
<img class="p3" src="img/behavior.png" width="1021" height="739" alt="Behavior settings: enable, start with Windows and the toggle hotkey" loading="lazy">
</div>

<div style="text-align:center;margin-top:48px"><a class="btn" href="https://github.com/priomsrb/window-focus-highlighter/releases/latest">Download</a> <a class="btn alt" href="https://github.com/priomsrb/window-focus-highlighter">GitHub</a></div>

<footer>MIT licensed &middot; <a href="https://github.com/priomsrb/window-focus-highlighter">Source on GitHub</a></footer>
</main>
</body>
</html>
